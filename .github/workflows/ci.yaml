name: CI

on:
  push:
    branches: 
      - main

jobs: 
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [lts/*, latest, 24.15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment | ${{ matrix.node }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm i
      - run: npm run test

      - name: Login into container registry
        uses: docker/login-action@v4.6.0
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}  
          password: ${{secrets.DOCKERHUB_TOKEN}}  
      - name: Get commit tag 
        id: get_tag    
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Build docker image
        run: docker build -t gabrielrarodrigues/devops-nest-api:${{steps.get_tag.outputs.sha}} .

      - name: Push docker image
        run: docker push gabrielrarodrigues/devops-nest-api:${{steps.get_tag.outputs.sha}}