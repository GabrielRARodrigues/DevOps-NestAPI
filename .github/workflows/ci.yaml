name: CI

on:
  push:
    branches: 
      - main

jobs: 
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.15
          cache: 'npm'
      - run: npm i
      - run: npm run test 