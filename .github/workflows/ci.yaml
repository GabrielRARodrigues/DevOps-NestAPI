name: CI

on:
  push:
    branches: 
      - main
permissions: 
  id-token: write
  contents: read

jobs: 
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node: [lts/*, latest, 24.15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # - name: Setup Node.js environment | ${{ matrix.node }}
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          # node-version: ${{ matrix.node }}
          node-version: 24.15
          cache: 'npm'
      - run: npm i
      - run: npm run test

      # - name: Login into container registry
      #   uses: docker/login-action@v4.6.0
      #   with:
      #     username: ${{vars.DOCKERHUB_USERNAME}}  
      #     password: ${{secrets.DOCKERHUB_TOKEN}}  

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with: 
          role-to-assume: ${{secrets.AWS_ECR_ROLE_ARN}}
          aws-region: ${{secrets.AWS_REGION}}
          
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2    

      - name: Get commit tag 
        id: get_tag    
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.get_tag.outputs.sha }}
        run: |
          docker build -t $REGISTRY/devops-nest-api:$TAG .
          docker push $REGISTRY/devops-nest-api:$TAG


      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v7.3.0
      #   with:
      #     push: true
      #     tags: gabrielrarodrigues/devops-nest-api:${{steps.get_tag.outputs.sha}},gabrielrarodrigues/devops-nest-api:latest