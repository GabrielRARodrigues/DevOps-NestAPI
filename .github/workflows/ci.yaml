name: CI

on:
  push:
    branches: 
      - main
permissions: 
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs: 
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node: [lts/*, latest, 24.15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # - name: Setup Node.js environment | ${{ matrix.node }}
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          # node-version: ${{ matrix.node }}
          node-version: 24.15
          cache: 'npm'
      - run: npm i
      - run: npm run test

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # - name: Login into container registry
      #   uses: docker/login-action@v4.6.0
      #   with:
      #     username: ${{vars.DOCKERHUB_USERNAME}}  
      #     password: ${{secrets.DOCKERHUB_TOKEN}}  

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with: 
          role-to-assume: ${{secrets.AWS_ECR_ROLE_ARN}}
          aws-region: ${{secrets.AWS_REGION}}
          
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2    

      - name: Get commit tag 
        id: get_tag    
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build-docker-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.get_tag.outputs.sha }}
        run: |
          docker build -t $REGISTRY/devops-nest-api:$TAG .
          docker push $REGISTRY/devops-nest-api:$TAG
          docker tag $REGISTRY/devops-nest-api:$TAG $REGISTRY/devops-nest-api:latest
          docker push $REGISTRY/devops-nest-api:latest
          IMAGE=$(echo $REGISTRY/devops-nest-api:$TAG)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v7.3.0
      #   with:
      #     push: true
      #     tags: gabrielrarodrigues/devops-nest-api:${{steps.get_tag.outputs.sha}},gabrielrarodrigues/devops-nest-api:latest

      - name: Deploy to App Runner
        id: deploy-app-runner
        uses: awslabs/amazon-app-runner-deploy@main    
        with:
          service: devops-nest-api
          image: ${{steps.build-docker-image.outputs.image}}
          access-role-arn: ${{secrets.AWS_APP_RUNNER_ROLE_ARN}}
          region: ${{secrets.AWS_REGION}}
          cpu: 1
          memory: 2
          port: 3000
          wait-for-service-stability-seconds: 180

      - name: App Runner check
        run: echo "App Runner running... ${{steps.deploy-app-runner.outputs.service-url}}"

        